# O nginx descarta os add_header do servidor quando um location tem os seus.
# Por isso o cache sai por um map, e não por locations: assim os cabeçalhos de
# segurança valem para todas as respostas.
map $uri $cache_do_arquivo {
    # A página, o modo offline e o manifesto mudam a cada versão: sempre conferir.
    # Sem isso, o celular continuaria abrindo a versão antiga depois do deploy.
    /                            "no-cache";
    ~*\.html$                    "no-cache";
    /sw.js                       "no-cache";
    ~*\.webmanifest$             "no-cache";
    # Ícones mudam raramente.
    ~*\.(png|svg)$               "public, max-age=604800";
    default                      "";
}

server {
    listen       80;
    server_name  _;
    root         /usr/share/nginx/html;
    index        index.html;
    charset      utf-8;
    server_tokens off;

    # Cabeçalhos de segurança.
    #
    # 'unsafe-inline' no script e no estilo é inevitável: o app é um HTML único com
    # tudo embutido. A CSP aqui serve para barrar script e envio de dados para fora
    # do que o app usa:
    #   - cdn.jsdelivr.net: leitor de QR code (jsQR)
    #   - fonts.googleapis.com / fonts.gstatic.com: a letra manuscrita da tela de entrada
    #   - api.anthropic.com: leitura da nota fiscal pela IA (só com a chave da pessoa)
    # connect-src repete o CDN e as fontes porque o modo offline (sw.js) busca esses
    # arquivos com fetch para guardar.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: blob:; connect-src 'self' https://api.anthropic.com https://cdn.jsdelivr.net https://fonts.googleapis.com https://fonts.gstatic.com; worker-src 'self'; manifest-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "DENY" always;
    add_header Permissions-Policy "camera=(self), geolocation=(), microphone=()" always;
    add_header Cache-Control $cache_do_arquivo always;

    gzip              on;
    gzip_types        text/css application/javascript application/manifest+json image/svg+xml;
    gzip_min_length   1024;

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # O nginx não conhece a extensão .webmanifest; sem o tipo certo o celular não
    # oferece "instalar app". (Sem add_header aqui, os do servidor continuam valendo.)
    location ~* \.webmanifest$ {
        types { }
        default_type application/manifest+json;
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ =404;
    }
}
